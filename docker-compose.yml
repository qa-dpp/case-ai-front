version: '3.8'

services:
  # 后端服务
  backend:
    image: registry.cn-hangzhou.aliyuncs.com/clairejing/case-ai-backend:0.0.5
    container_name: case-ai-backend
    # 后端服务不对外暴露端口，只在内部网络中可用
    networks:
      - case-ai-network
    # 如果需要配置后端服务的环境变量，可以在这里添加
    # environment:
    #   - SPRING_PROFILES_ACTIVE=prod
    #   - DATABASE_URL=jdbc:mysql://db:3306/case_ai
    volumes:
      # 挂载我们创建的nginx代理配置文件
       - ./config:/app/config

  # 前端服务
  frontend:
    image: registry.cn-hangzhou.aliyuncs.com/clairejing/case-ai-front:0.0.3
    container_name: case-ai-front
    depends_on:
      - backend
    # 前端服务不对外暴露端口，通过nginx代理访问
    networks:
      - case-ai-network


  # Nginx代理服务，处理所有外部请求
  nginx-proxy:
    image: nginx:alpine
    container_name: case-ai-nginx-proxy
    depends_on:
      - frontend
      - backend
    ports:
      - "3888:80"
    networks:
      - case-ai-network
    volumes:
      # 挂载我们创建的nginx代理配置文件
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf
    # 可以根据需要添加健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  case-ai-network:
    driver: bridge
    name: case-ai-network

# 可选：如果需要持久化数据，可以添加volumes配置
# volumes:
#   - db-data:/var/lib/mysql

# volumes:
#   db-data: